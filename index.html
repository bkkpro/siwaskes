<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>SIWASKES - Vaksinasi Internasional</title>
  
  <link rel="icon" href="https://raw.githubusercontent.com/pipin4/aset_sisegar/main/siwaskes_icon.png">
  
  <style>
    /* Mengatur agar halaman tidak bisa di-scroll dan full screen */
    html, body { 
      margin: 0; 
      padding: 0; 
      width: 100%; 
      height: 100%; 
      overflow: hidden; 
      background: #f2f5fa; 
    }
    
    /* TRIK: Menarik iframe ke atas untuk memotong banner Apps Script */
    iframe { 
      position: fixed; 
      top: -36px; /* Menarik ke atas sebesar tinggi banner Google */
      left: 0; 
      width: 100%; 
      height: calc(100% + 36px); /* Mengkompensasi tinggi yang ditarik agar bawahnya tidak ngatung */
      border: 0; 
      background: #f2f5fa; 
    }
  </style>
</head>
<body>

  <!-- Aplikasi SIWASKES dimuat di dalam iframe tanpa loading screen -->
  <iframe id="app" title="SIWASKES" allow="fullscreen" src="https://bkk.s.gy/siwaskes"></iframe>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>SIWASKES - Vaksinasi Internasional</title>
  
  <!-- Ganti href di bawah dengan link file icon SIWASKES yang ada di repository github Anda -->
  <link rel="icon" href="https://raw.githubusercontent.com/pipin4/aset_sisegar/main/siwaskes_icon.png">
  
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#f2f5fa; font-family:'Poppins', 'Segoe UI', Roboto, Arial, sans-serif; }
    
    /* Warna background disesuaikan dengan tema SIWASKES */
    #loader { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; background:linear-gradient(135deg, #007376, #14b8a6); color:#fff; z-index:2; transition:opacity .5s ease; }
    
    #loader img { width:90px; height:90px; border-radius:18px; background:#fff; padding:12px; box-shadow:0 10px 25px rgba(0,0,0,.2); object-fit:contain; box-sizing:border-box; }
    #loader b { font-size:22px; letter-spacing:1px; font-weight:700; }
    #loader span { font-size:13px; opacity:.9; }
    #loader.hide { opacity:0; pointer-events:none; }
    
    iframe { position:fixed; inset:0; width:100%; height:100%; border:0; background:#f2f5fa; }
    
    #fallback { position:fixed; bottom:12px; left:0; right:0; text-align:center; font-size:12px; color:#fff; z-index:3; }
    #fallback a { color:#fff; font-weight:700; }
  </style>
</head>
<body>
  <div id="loader">
    <!-- Ganti src di bawah dengan link gambar logo SIWASKES yang ada di repository github Anda -->
    <img src="https://raw.githubusercontent.com/pipin4/aset_sisegar/main/siwaskes_logo.png" alt="Logo SIWASKES">
    <b>SIWASKES</b>
    <span>Memuat aplikasi...</span>
  </div>
  
  <div id="fallback">Layar tidak muncul? <a id="directLink" href="#" target="_top">Buka langsung</a></div>

  <!-- Tautan iframe sudah diarahkan ke SIWASKES -->
  <iframe id="app" title="SIWASKES" allow="fullscreen"
          src="https://bkk.s.gy/siwaskes"></iframe>

  <script>
    var frame = document.getElementById('app');
    document.getElementById('directLink').href = frame.src;
    frame.addEventListener('load', function () {
      document.getElementById('loader').classList.add('hide');
      document.getElementById('fallback').style.display = 'none';
    });
    
    // Jika dalam 12 detik belum selesai dimuat, loader disembunyikan agar tombol fallback terlihat
    setTimeout(function () { 
      document.getElementById('loader').classList.add('hide'); 
    }, 12000);
  </script>
</body>
</html>
